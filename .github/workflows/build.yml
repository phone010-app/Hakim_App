name: بناء APK للتطبيق

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: بناء ملف APK
    runs-on: ubuntu-latest

    steps:
      - name: تنزيل الكود من المستودع
        uses: actions/checkout@v4

      - name: تثبيت Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: التأكد من مشروع Flutter
        working-directory: phone_repair_manager
        run: |
          echo "Project directory:"
          pwd
          echo "pubspec.yaml:"
          grep '^name:' pubspec.yaml
          echo "Flutter version:"
          flutter --version

      - name: توليد Android إذا لم يكن موجوداً
        working-directory: phone_repair_manager
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.repairshop .
          fi

      - name: تنزيل المكتبات
        working-directory: phone_repair_manager
        run: flutter pub get

      - name: فحص اسم الحزمة
        working-directory: phone_repair_manager
        run: |
          echo "Package name:"
          grep '^name:' pubspec.yaml
          test "$(grep '^name:' pubspec.yaml | awk '{print $2}')" = "hakim_app"

      - name: فحص الكود
        working-directory: phone_repair_manager
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: بناء APK Release
        working-directory: phone_repair_manager
        run: flutter build apk --release

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: phone_repair_manager/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: إنشاء Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "إصدار تلقائي #${{ github.run_number }}"
          body: "بُني تلقائياً من الكوميت ${{ github.sha }}"
          files: phone_repair_manager/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
