name: بناء APK للتطبيق

# متى يعمل هذا السكريبت تلقائياً:
# - عند رفع (push) أي تعديل إلى فرع main
# - يمكن أيضاً تشغيله يدوياً من تبويب Actions بالضغط على "Run workflow"
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: بناء ملف APK
    runs-on: ubuntu-latest

    steps:
      - name: تنزيل الكود من المستودع
        uses: actions/checkout@v4

      - name: تثبيت Java (مطلوب لبناء أندرويد)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # إن كان مجلد android غير موجود في المستودع (كود مصدري فقط)
      # هذه الخطوة تولّده تلقائياً قبل البناء
      - name: توليد ملفات المنصة (android) إن لم تكن موجودة
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.repairshop .
          fi

      - name: تنزيل المكتبات (pub get)
        run: flutter pub get

      - name: فحص الكود (اختياري، لا يوقف البناء عند وجود تحذيرات بسيطة)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: بناء ملف APK (نسخة release)
        run: flutter build apk --release

      # رفع الملف الناتج كـ "Artifact" يمكن تنزيله من صفحة الـ Run نفسها
      - name: رفع ملف APK كمرفق قابل للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # إنشاء إصدار (Release) رسمي على GitHub يحتوي رابط تحميل مباشر
      # يعمل فقط عند الرفع إلى main (وليس عند التشغيل اليدوي)
      - name: إنشاء إصدار (Release) برقم تسلسلي وإرفاق APK به
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "إصدار تلقائي #${{ github.run_number }}"
          body: "بُني تلقائياً من الكوميت ${{ github.sha }}"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
